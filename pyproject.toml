[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "congress-api"
version = "1.0.0"
description = "Production-ready Python client and CLI for the Congress.gov API v3"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Congress API Contributors"}]
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
congress = "congress_api.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["congress_api"]
